services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./uploads:/code/uploads
      - ./logs:/code/logs
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://astrynox:password@postgres:5432/astrynox-ai
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
    depends_on:
      - postgres
      - qdrant
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BASE_API_URL: ${NEXT_PUBLIC_BASE_API_URL}
        NEXT_PUBLIC_BASE_HRIS_URL: ${NEXT_PUBLIC_BASE_HRIS_URL}
    ports:
      - "9005:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: astrynox
      POSTGRES_PASSWORD: password
      POSTGRES_DB: astrynox-ai
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  qdrant_data:
  redis_data: